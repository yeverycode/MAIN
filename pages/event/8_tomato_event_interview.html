<main class="event-detail" id="main">
  <div class="event-detail__inner">

    <!-- 상단 제목 / 행사일 라인 -->
    <section class="event-detail__header">
      <div class="event-detail__header-top-line" aria-hidden="true"></div>
      <div class="event-detail__header-row">
        <div class="event-detail__meta-label">제목</div>
        <div class="event-detail__meta-value" id="event-meta-title"></div>
      </div>
      <div class="event-detail__header-bottom-line" aria-hidden="true"></div>
    </section>

    <!-- 썸네일 + 정보 카드 -->
    <section class="event-detail__summary" aria-label="행사 요약">
      <figure class="event-detail__cover">
        <img
          id="event-cover"
          src="/assets/event_interview_cover.svg"
          alt="코드를 요리하다 흑백요리사 행사 포스터"
          loading="lazy"
        />
      </figure>

      <aside class="event-detail__info-card" aria-label="행사 기본 정보">
        <div class="event-detail__info-top">
          <p class="event-detail__event-name" id="event-name"></p>
          <div class="event-detail__divider" aria-hidden="true"></div>
        </div>

        <dl class="event-detail__info-list">

            <dt>행사 날짜</dt>
            <dd id="event-date-full"></dd>
          </div>
          <div class="event-detail__info-item">
            <dt>장소</dt>

          </div>
          <div class="event-detail__info-item">
            <dt>참여 대상</dt>
            <dd id="event-target-line1"></dd>
            <dd id="event-target-line2"></dd>
          </div>
          <div class="event-detail__info-item">
            <dt>설명</dt>
            <dd id="event-description"></dd>
          </div>
        </dl>
      </aside>
    </section>

    <div class="event-detail__section-divider" aria-hidden="true"></div>

    <!-- 인터뷰 본문 -->
    <section class="event-detail__qa" aria-label="행사 기획 인터뷰">
      <!-- 상단: 이미지 + Q1/Q2 -->
      <article class="qa-row qa-row--image-with-questions">
        <div class="qa-row__image">
          <img id="qa-top-image" src="" alt="" loading="lazy" />
        </div>
        <div class="qa-row__content-col">
          <div class="qa-entry" id="q1-wrap">
            <p class="qa-entry__label" id="q1-label"></p>
            <h2 class="qa-entry__question" id="q1-question"></h2>
            <p class="qa-entry__answer" id="q1-answer"></p>
          </div>
          <div class="qa-entry" id="q2-wrap">
            <p class="qa-entry__label" id="q2-label"></p>
            <h2 class="qa-entry__question" id="q2-question"></h2>
            <p class="qa-entry__answer" id="q2-answer"></p>
          </div>
        </div>
      </article>

      <div class="qa-divider qa-divider--section" aria-hidden="true"></div>

      <!-- 중단: Q3, Q4 -->
      <article class="qa-row qa-row--text-pair">
        <div class="qa-entry" id="q3-wrap">
          <p class="qa-entry__label" id="q3-label"></p>
          <h2 class="qa-entry__question" id="q3-question"></h2>
          <p class="qa-entry__answer" id="q3-answer"></p>
        </div>
        <div class="qa-entry" id="q4-wrap">

        </div>

      <div class="qa-divider qa-divider--section" aria-hidden="true"></div>

      <!-- 하단: 사진 + Q5/Q6 -->
      <article class="qa-row qa-row--image-bottom">
        <div class="qa-row__image qa-row__image--wide">
          <img id="qa-bottom-image" src="" alt="" loading="lazy" />
        </div>
        <div class="qa-row__content-col qa-row__content-col--center">
          <div class="qa-entry" id="q5-wrap">
            <p class="qa-entry__label" id="q5-label"></p>
            <h2 class="qa-entry__question" id="q5-question"></h2>
