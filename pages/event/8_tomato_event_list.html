  <!-- 본문 흰 배경 섹션 -->
  <main class="event-main" id="mainContent">
    <section class="event-main__inner">

      <!-- 상단 배너 -->
      <div class="event-banner">
        <img
          src="https://placehold.co/1245x214"
          alt="숙명여자대학교 인공지능공학부 행사 배너"
          class="event-banner__image"
        />
        <div class="event-banner__dots" aria-hidden="true">
          <span class="dot dot--active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <!-- 뷰 전환 + 아이콘 영역 -->
      <div class="event-toolbar">
        <div class="event-view-icons" role="radiogroup" aria-label="이벤트 보기 방식">
          <button
            type="button"
            class="view-icon view-icon--active"
            data-view="list"
            aria-pressed="true"
          >
            <span class="sr-only">리스트 보기</span>
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <circle cx="9" cy="9" r="1.8"></circle>
              <line x1="13" y1="9" x2="25" y2="9"></line>
              <circle cx="9" cy="16" r="1.8"></circle>
              <line x1="13" y1="16" x2="25" y2="16"></line>
              <circle cx="9" cy="23" r="1.8"></circle>
              <line x1="13" y1="23" x2="25" y2="23"></line>
            </svg>
          </button>
          <button
            type="button"
            class="view-icon"
            data-view="calendar"
            aria-pressed="false"
          >
            <span class="sr-only">캘린더 보기</span>
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <rect x="6" y="9" width="20" height="17" rx="2" ry="2"></rect>
              <line x1="6" y1="13" x2="26" y2="13"></line>
              <line x1="12" y1="6" x2="12" y2="11"></line>
              <line x1="20" y1="6" x2="20" y2="11"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- 리스트 / 캘린더 컨테이너 -->
      <section class="event-content" aria-live="polite">
        <!-- 리스트 뷰 -->
        <div class="event-list" id="eventList" data-view="list">
          <!-- JS가 카드 자동 생성 -->
        </div>

        <!-- 캘린더 뷰 (지금은 안내만) -->
        <div class="event-calendar" id="eventCalendar" data-view="calendar" hidden>
          <section class="page-calendar-section" aria-label="학과 일정 캘린더">
            <header class="calendar-header">
              <div class="calendar-header-top">
                <div class="calendar-title">
                  <div class="calendar-title__month-number" id="calendarMonthNumber">--</div>
                  <div class="calendar-title__text">
                    <div class="calendar-title__year" id="calendarYear">--</div>
                    <div class="calendar-title__month-label" id="calendarMonthLabel"></div>
                  </div>
                </div>
                <div class="calendar-month-nav">
                  <button type="button" id="calendarPrevMonth" aria-label="이전 달">&lt;</button>
                  <button type="button" id="calendarNextMonth" aria-label="다음 달">&gt;</button>
                </div>
              </div>

              <div class="calendar-controls">
                <div class="calendar-filter-segment">
                  <button type="button" class="filter-chip is-active" data-calendar-filter="all">전체</button>
                  <button type="button" class="filter-chip" data-calendar-filter="ongoing">진행/예정</button>
                  <button type="button" class="filter-chip" data-calendar-filter="past">종료</button>
                </div>

                <div class="calendar-legend">
                  <div class="legend-item legend-academic">학사 일정</div>
                  <div class="legend-item legend-department">학과 일정</div>
                  <div class="legend-item legend-event">학과 행사</div>
                </div>
              </div>
            </header>

            <div class="calendar-weekdays" aria-hidden="true">
              <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
            </div>

            <div id="calendarGrid" class="calendar-grid"></div>

            <div id="calendarDetail" class="calendar-detail">
              <div class="calendar-detail__date" id="detailDateText"></div>
              <div id="detailEventList" class="calendar-detail__events"></div>
            </div>
          </section>
        </div>
      </section>

    </section>
  </main>
