  <!-- 본문 흰 배경 섹션 -->

    <section class="event-main__inner">

      <!-- 상단 배너 -->
      <div class="event-banner">
        <img
          src="https://placehold.co/1245x214"
          alt="숙명여자대학교 인공지능공학부 행사 배너"
          class="event-banner__image"
        />
        <div class="event-banner__dots" aria-hidden="true">
          <span class="dot dot--active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <!-- 뷰 전환 + 아이콘 영역 -->
      <div class="event-toolbar">
        <div class="event-view-icons" role="radiogroup" aria-label="이벤트 보기 방식">
          <button
            type="button"
            class="view-icon view-icon--active"
            data-view="list"
            aria-pressed="true"
          >
            <span class="sr-only">리스트 보기</span>
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <circle cx="9" cy="9" r="1.8"></circle>
              <line x1="13" y1="9" x2="25" y2="9"></line>
              <circle cx="9" cy="16" r="1.8"></circle>
              <line x1="13" y1="16" x2="25" y2="16"></line>
              <circle cx="9" cy="23" r="1.8"></circle>
              <line x1="13" y1="23" x2="25" y2="23"></line>
            </svg>
          </button>
          <button
            type="button"
            class="view-icon"
            data-view="calendar"
            aria-pressed="false"
          >
            <span class="sr-only">캘린더 보기</span>
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <rect x="6" y="9" width="20" height="17" rx="2" ry="2"></rect>
              <line x1="6" y1="13" x2="26" y2="13"></line>
              <line x1="12" y1="6" x2="12" y2="11"></line>
              <line x1="20" y1="6" x2="20" y2="11"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- 리스트 / 캘린더 컨테이너 -->
      <section class="event-content" aria-live="polite">
        <!-- 리스트 뷰 -->
        <div class="event-list" id="eventList" data-view="list">
          <!-- JS가 카드 자동 생성 -->
        </div>

        <!-- 캘린더 뷰 (지금은 안내만) -->
        <div class="event-calendar" id="eventCalendar" data-view="calendar" hidden>
          <p class="event-calendar__placeholder">
            📅 캘린더 보기는 추후 업데이트될 예정입니다.
          </p>
        </div>
      </section>
