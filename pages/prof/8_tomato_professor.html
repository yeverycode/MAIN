<!-- 여기부터 교수 상세 페이지 -->
<main class="prof-page">
  <section class="content prof-detail">
    <div class="container">

      <div class="prof-layout">

        <!-- 사진 -->
        <div class="prof-slot prof-slot--photo">
          <div class="prof-photo-card">
            <img
              id="prof-photo"
              src=""
              alt="교수님 사진"
              class="prof-photo-card__img"
            >
          </div>
        </div>

        <!-- 기본 정보 -->
        <div class="prof-slot prof-slot--info">
          <header class="prof-info-header">
            <p class="prof-info-header__title">
              <span class="prof-info-header__role" id="prof-role"></span>
              <span class="prof-info-header__name" id="prof-name"></span>
            </p>

            <ul class="prof-contact-list">
              <li>
                <span class="prof-contact-icon" aria-hidden="true">
                  <!-- SVG 그대로 유지 -->
                  <svg width="14" height="14" viewBox="0 0 14 14">
                    <path d="M12.6283 9.54705L10.6487 9.32103C10.1733 9.26648 9.70573 9.43014 9.37061 9.76526L7.93661 11.1993C5.73106 10.077 3.92298 8.2767 2.80072 6.06335L4.24251 4.62155C4.57763 4.28643 4.74129 3.81882 4.68673 3.34341L4.46072 1.37945C4.3672 0.592307 3.70476 0 2.90983 0H1.56156C0.680894 0 -0.0516913 0.73259 0.00286291 1.61326C0.415916 8.26891 5.73885 13.5841 12.3867 13.9971C13.2673 14.0517 13.9999 13.3191 13.9999 12.4384V11.0902C14.0077 10.303 13.4154 9.64057 12.6283 9.54705Z" fill="#0163FF"/>
                  </svg>
                </span>
                <span id="prof-phone"></span>
              </li>

              <li>
                <span class="prof-contact-icon" aria-hidden="true">
                  <svg width="16" height="12" viewBox="0 0 16 12">
                    <path d="M14.4 0H1.6C0.72 0 0.008 0.675 0.008 1.5L0 10.5C0 11.325 0.72 12 1.6 12H14.4C15.28 12 16 11.325 16 10.5V1.5C16 0.675 15.28 0 14.4 0Z"/>
                  </svg>
                </span>
                <a href="#" id="prof-email-link">
                  <span id="prof-email-text"></span>
                </a>
              </li>

              <li>
                <span class="prof-contact-icon" aria-hidden="true">
                  <svg width="14" height="17" viewBox="0 0 14 17">
                    <path d="M7 8.5C7.48 8.5 7.89 8.33 8.23 8C8.58 7.67 8.75 7.27 8.75 6.8C8.75 6.33 8.58 5.93 8.23 5.6C7.89 5.27 7.48 5.1 7 5.1C6.52 5.1 6.11 5.27 5.76 5.6C5.42 5.93 5.25 6.33 5.25 6.8C5.25 7.27 5.42 7.67 5.76 8C6.11 8.33 6.52 8.5 7 8.5Z"/>
                  </svg>
                </span>
                <span id="prof-office"></span>
              </li>
            </ul>
          </header>

          <!-- 관심분야 -->

            <h2 class="prof-block__title">관심분야</h2>
            <div class="prof-block__divider"></div>

                  <th scope="col">과목코드</th>
                  <th scope="col">과목명</th>
                </tr>
              </thead>
              <tbody id="prof-courses">
                <!-- JS에서 tr 생성 -->
              </tbody>
            </table>
          </section>
        </div>

        <div class="prof-slot prof-slot--pub">

            <div class="prof-bottom-line"></div>
            <table class="prof-table prof-pub-table">
              <thead>

                  <th scope="col">제목</th>
                  <th scope="col">발행일</th>
                  <th scope="col">학회지</th>
                  <th scope="col">발행처</th>
                  <th scope="col">논문번호</th>
                </tr>
              </thead>
              <tbody id="prof-pubs">
                <!-- JS에서 tr 생성 -->
              </tbody>
            </table>
          </section>
        </div>

      </div>
