<!-- 여기부터 교수 상세 페이지 -->
<main class="prof-page">
  <section class="content prof-detail">
    <div class="container">

      <div class="prof-layout">

        <!-- 사진 -->
        <div class="prof-slot prof-slot--photo">
          <div class="prof-photo-card">
            <img
              id="prof-photo"
              src=""
              alt="교수님 사진"
              class="prof-photo-card__img"
            >
          </div>
        </div>

        <!-- 기본 정보 -->
        <div class="prof-slot prof-slot--info">
          <header class="prof-info-header">
            <p class="prof-info-header__title">
              <span class="prof-info-header__role" id="prof-role"></span>
              <span class="prof-info-header__name" id="prof-name"></span>
            </p>

            <ul class="prof-contact-list">
              <li>
                <span class="prof-contact-icon" aria-hidden="true">
                  <!-- SVG 그대로 유지 -->
                  <svg width="14" height="14" viewBox="0 0 14 14">
                    <path d="M12.6283 9.54705L10.6487 9.32103C10.1733 9.26648 9.70573 9.43014 9.37061 9.76526L7.93661 11.1993C5.73106 10.077 3.92298 8.2767 2.80072 6.06335L4.24251 4.62155C4.57763 4.28643 4.74129 3.81882 4.68673 3.34341L4.46072 1.37945C4.3672 0.592307 3.70476 0 2.90983 0H1.56156C0.680894 0 -0.0516913 0.73259 0.00286291 1.61326C0.415916 8.26891 5.73885 13.5841 12.3867 13.9971C13.2673 14.0517 13.9999 13.3191 13.9999 12.4384V11.0902C14.0077 10.303 13.4154 9.64057 12.6283 9.54705Z" fill="#0163FF"/>
                  </svg>
                </span>
                <span id="prof-phone"></span>
              </li>

              <li>
                <span class="prof-contact-icon" aria-hidden="true">
                  <img src="/assets/8_tomato_email.svg" alt="" width="16" height="12" />
                </span>
                <a href="#" id="prof-email-link">
                  <span id="prof-email-text"></span>
                </a>
              </li>

              <li>
                <span class="prof-contact-icon" aria-hidden="true">
                  <img src="/assets/8_tomato_location.svg" alt="" width="14" height="17" />
                </span>
                <span id="prof-office"></span>
              </li>
            </ul>
          </header>

          <!-- 관심분야 -->
          <section class="prof-block">
            <h2 class="prof-block__title">관심분야</h2>
            <div class="prof-block__divider"></div>
            <div class="prof-tag-list" id="prof-interests">
              <!-- JS가 span.prof-tag 추가 -->
            </div>
          </section>

          <!-- 주요경력 -->
          <section class="prof-block">
            <h2 class="prof-block__title">주요경력</h2>
            <div class="prof-block__divider"></div>
            <table class="prof-table prof-history-table">
              <tbody id="prof-history">
                <!-- JS가 tr 생성 -->
              </tbody>
            </table>
          </section>
        </div>

        <!-- 담당 교과목 -->
        <div class="prof-slot prof-slot--course">
          <section class="prof-bottom-section prof-course-section">
            <h2 class="prof-bottom-title">담당교과목</h2>
            <div class="prof-bottom-line"></div>
            <table class="prof-table prof-course-table">
              <thead>
                <tr>
                  <th scope="col">학기</th>
                  <th scope="col">과목코드</th>
                  <th scope="col">과목명</th>
                </tr>
              </thead>
              <tbody id="prof-courses">
                <!-- JS에서 tr 생성 -->
              </tbody>
            </table>
          </section>
        </div>

        <!-- 논문 게재 -->
        <div class="prof-slot prof-slot--pub">
          <section class="prof-bottom-section prof-pub-section">
            <div class="prof-bottom-header">
              <h2 class="prof-bottom-title">논문게재</h2>
              <div class="prof-pagination" id="prof-pub-pagination" aria-live="polite">
                <button type="button" class="prof-pagination__btn" data-dir="prev" aria-label="이전 논문 목록">
                  &lt;
                </button>
                <span class="prof-pagination__status" id="prof-pub-page-status"></span>
                <button type="button" class="prof-pagination__btn" data-dir="next" aria-label="다음 논문 목록">
                  &gt;
                </button>
              </div>
            </div>
            <div class="prof-bottom-line prof-bottom-line--pub"></div>
            <table class="prof-table prof-pub-table">
              <thead>
                <tr>
                  <th scope="col">게재년월</th>
                  <th scope="col">논문 이름</th>
                  <th scope="col">발행처</th>
                </tr>
              </thead>
              <tbody id="prof-pubs">
                <!-- JS에서 tr 생성 -->
              </tbody>
            </table>
          </section>
        </div>

      </div>
    </div>
  </section>
